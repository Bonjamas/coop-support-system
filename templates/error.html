<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>Coop IT Support</title>
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
</head>

<body class="bg-gray-100 h-screen flex items-center justify-center">

<!-- Hvid kort-boks i midten af skærmen -->
<div class="bg-white rounded-2xl shadow-lg p-10 max-w-md w-full text-center">

    {% if variant == "db" %}

        <!-- Variant: database er nede (vises fra /db-error) -->

        <!-- Rødt advarselsikon -->
        <div class="flex justify-center mb-4">
            <div class="bg-red-100 text-red-600 rounded-full p-4 text-2xl">⚠️</div>
        </div>

        <h2 class="text-2xl font-bold text-gray-800 mb-2">Database er nede</h2>
        <p class="text-gray-500 mb-6">Systemet forsøger automatisk at genoprette forbindelsen...</p>

        <!-- Spinner mens vi venter -->
        <div class="flex justify-center mb-4">
            <div class="animate-spin rounded-full h-8 w-8 border-4 border-red-500 border-t-transparent"></div>
        </div>

        <!-- Tæller ned og henter siden igen automatisk (se db_error.js) -->
        <p id="refresh-text" class="text-sm text-gray-400">Siden opdateres automatisk om 5 sekunder...</p>

        <div class="mt-6">
            <a href="/" class="text-sm text-red-600 hover:underline">Prøv igen nu</a>
        </div>

        <script src="{{ url_for('static', filename='js/db_error.js') }}"></script>

    {% else %}

        <!-- Variant: generisk HTTP-fejl (404, 403, 400, 500) -->

        <img src="{{ url_for('static', filename='images/coop-logo.png') }}" class="h-12 mx-auto mb-6">

        <h1 class="text-5xl font-bold text-gray-800 mb-2">{{ code }}</h1>
        <p class="text-gray-600 mb-8">{{ message }}</p>

        <a href="/" class="bg-red-600 text-white px-6 py-2 rounded hover:bg-red-700 inline-block">
            Tilbage til forsiden
        </a>

    {% endif %}

</div>

</body>
</html>
