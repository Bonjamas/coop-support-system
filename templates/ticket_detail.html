{% extends "base.html" %}

{% block content %}

<!-- 🔝 TOPBAR -->
<div class="bg-white shadow rounded-xl p-4 flex justify-between items-center mb-4">

    <div class="font-semibold text-gray-700">
        Incident - INC{{ "%06d"|format(ticket.id) }}
    </div>

    <div class="flex gap-2">

        <!-- GEM -->
        <button form="editForm"
                class="bg-blue-600 text-white px-4 py-2 rounded text-sm">
            Gem
        </button>

        <!-- LØS -->
        <button type="button"
                onclick="setResolved(); document.getElementById('editForm').submit();"
                class="bg-green-600 text-white px-4 py-2 rounded text-sm">
            Løs
        </button>

    </div>
</div>

<div class="space-y-6">

    <!-- 🔲 TOP GRID -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

        <!-- LEFT -->
        <div class="bg-white p-5 rounded-xl shadow space-y-4">

            <!-- NUMMER -->
            <div>
                <label class="text-xs text-gray-500">Nummer</label>
                <input value="INC{{ "%06d"|format(ticket.id) }}"
                       class="w-full border p-2 rounded bg-gray-100" disabled>
            </div>

            <!-- ANMODET AF -->
            <div>
                <label class="text-xs text-gray-500">Anmodet af *</label>

                <input id="requestedSearch"
                       value="{{ ticket.requested_by_name or '' }}"
                       class="w-full border p-2 rounded">

                <div id="requestedResults"
                     class="hidden border bg-white shadow rounded max-h-40 overflow-y-auto"></div>

                <input type="hidden" name="requested_by" id="requested_oid" form="editForm">
                <input type="hidden" name="requested_by_name" id="requested_name" form="editForm">
            </div>

            <!-- KONTAKT -->
            <div>
                <label class="text-xs text-gray-500">Kontakt info *</label>
                <input name="contact_info"
                       value="{{ ticket.contact_info or '' }}"
                       form="editForm"
                       class="w-full border p-2 rounded">
            </div>

            <!-- TYPE -->
            <div>
                <label class="text-xs text-gray-500">Type *</label>
                <select name="type" form="editForm" class="w-full border p-2 rounded">
                    <option value="support" {% if ticket.type=="support" or not ticket.type %}selected{% endif %}>Brugersupport</option>
                    <option value="funktionalitet" {% if ticket.type=="funktionalitet" %}selected{% endif %}>Funktionalitet</option>
                    <option value="nedbrud" {% if ticket.type=="nedbrud" %}selected{% endif %}>Nedbrud</option>
                </select>
            </div>

            <!-- PRIORITET -->
            <div>
                <label class="text-xs text-gray-500">Prioritet *</label>
                <select name="priority" form="editForm" class="w-full border p-2 rounded">
                    <option value="low" {% if ticket.priority=="low" %}selected{% endif %}>Lav</option>
                    <option value="medium" {% if ticket.priority=="medium" or not ticket.priority %}selected{% endif %}>Mellem</option>
                    <option value="high" {% if ticket.priority=="high" %}selected{% endif %}>Høj</option>
                </select>
            </div>

        </div>

        <!-- RIGHT -->
        <div class="bg-white p-5 rounded-xl shadow space-y-4">

            <!-- TILSTAND -->
            <div>
                <label class="text-xs text-gray-500">Tilstand</label>
                <select name="state" form="editForm" class="w-full border p-2 rounded">
                    <option value="new" {% if ticket.state=="new" %}selected{% endif %}>Ny</option>
                    <option value="in_progress" {% if ticket.state=="in_progress" %}selected{% endif %}>I gang</option>
                    <option value="resolved" {% if ticket.state=="resolved" %}selected{% endif %}>Løst</option>
                </select>
            </div>

            <!-- TILDELT -->
            <div>
                <label class="text-xs text-gray-500">Tildelt til *</label>

                <input id="assignedSearch"
                       value="{{ ticket.assigned_to_name or '' }}"
                       class="w-full border p-2 rounded">

                <div id="assignedResults"
                     class="hidden border bg-white shadow rounded max-h-40 overflow-y-auto"></div>

                <input type="hidden" name="assigned_to" id="assigned_oid" form="editForm">
                <input type="hidden" name="assigned_to_name" id="assigned_name" form="editForm">
            </div>

            <!-- META -->
            <div>
                <label class="text-xs text-gray-500">Oprettet af</label>
                <input value="{{ ticket.created_by_name }}" class="w-full border p-2 rounded bg-gray-100" disabled>
            </div>

            <div>
                <label class="text-xs text-gray-500">Oprettet</label>
                <input value="{{ ticket.created_at.strftime('%d-%m-%Y %H:%M') }}" class="w-full border p-2 rounded bg-gray-100" disabled>
            </div>

            <div>
                <label class="text-xs text-gray-500">Opdateret</label>
                <input value="{{ ticket.updated_at.strftime('%d-%m-%Y %H:%M') }}" class="w-full border p-2 rounded bg-gray-100" disabled>
            </div>

        </div>

    </div>

    <!-- 📝 FORM -->
    <form method="POST" id="editForm" class="bg-white p-6 rounded-xl shadow space-y-4">
        <input type="hidden" name="action" value="edit">

        <div>
            <label class="text-xs text-gray-500">Titel *</label>
            <input name="title" value="{{ ticket.title }}" class="w-full border p-2 rounded">
        </div>

        <div>
            <label class="text-xs text-gray-500">Beskrivelse</label>
            <textarea name="description" class="w-full border p-2 rounded h-32">{{ ticket.description }}</textarea>
        </div>
    </form>

    <!-- 💬 ACTIVITY -->
    <div class="bg-white p-6 rounded-xl shadow space-y-4">

        <h3 class="font-semibold">Aktivitet</h3>

        <!-- NY KOMMENTAR -->
        <form method="POST" class="space-y-3">
            <input type="hidden" name="action" value="comment">

            <textarea name="text"
                      class="w-full border p-2 rounded h-20"
                      placeholder="Skriv kommentar..."></textarea>

            <div class="flex gap-3">
                <select name="type" class="border p-2 rounded text-sm">
                    <option value="comment">Kommentar</option>
                    {% if role != "butik" %}
                    <option value="note">Intern note</option>
                    {% endif %}
                </select>

                <button class="bg-green-600 text-white px-4 py-2 rounded">
                    Send
                </button>
            </div>
        </form>

        <!-- LISTE -->
        {% for c in comments|sort(attribute='created_at', reverse=True) %}
            <div class="border-l-4 pl-4
                {% if c.type == 'note' %}
                    border-yellow-400 bg-yellow-50
                {% else %}
                    border-blue-400 bg-blue-50
                {% endif %}
                p-3 rounded">

                <div class="text-xs text-gray-500">
                    {{ c.author_name }} · {{ c.created_at.strftime("%d-%m-%Y %H:%M") }}
                </div>

                <div class="text-sm">
                    {{ c.text }}
                </div>

            </div>
        {% endfor %}

    </div>

</div>

<!-- 🔍 AUTOCOMPLETE -->
<script>
function setupSearch(inputId, resultsId, oidId, nameId) {
    const input = document.getElementById(inputId);
    const results = document.getElementById(resultsId);

    if (!input || !results) return;

    input.addEventListener("input", async () => {
        const q = input.value;

        if (q.length < 2) {
            results.classList.add("hidden");
            return;
        }

        const res = await fetch(`/api/users?q=${encodeURIComponent(q)}`);
        const users = await res.json();

        results.innerHTML = "";
        results.classList.remove("hidden");

        users.forEach(u => {
            const div = document.createElement("div");
            div.className = "p-2 hover:bg-gray-100 cursor-pointer";
            div.innerText = u.name;

            div.onclick = () => {
                document.getElementById(oidId).value = u.oid;
                document.getElementById(nameId).value = u.name;
                input.value = u.name;
                results.classList.add("hidden");
            };

            results.appendChild(div);
        });
    });

    // 🔥 vigtigt: hvis user skriver selv → nulstil hidden
    input.addEventListener("change", () => {
        document.getElementById(oidId).value = "";
        document.getElementById(nameId).value = input.value;
    });

    document.addEventListener("click", (e) => {
        if (!input.contains(e.target) && !results.contains(e.target)) {
            results.classList.add("hidden");
        }
    });
}

setupSearch("requestedSearch", "requestedResults", "requested_oid", "requested_name");
setupSearch("assignedSearch", "assignedResults", "assigned_oid", "assigned_name");

function setResolved() {
    const stateSelect = document.querySelector('select[name="state"]');
    if (stateSelect) {
        stateSelect.value = "resolved";
    }
}
</script>

{% endblock %}
